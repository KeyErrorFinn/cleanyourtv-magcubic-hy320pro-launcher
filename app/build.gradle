plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34
    ndkVersion '30.0.16248370'
    buildFeatures { buildConfig true }
    flavorDimensions 'edition'
    productFlavors {
        basic {
            dimension 'edition'
            buildConfigField 'boolean', 'ADVANCED_SETTINGS', 'false'
            // Seasonal skins are an opt-in extra here: set seasonal_mode in config.xml or a theme to turn them on.
            buildConfigField 'String', 'SEASONAL_DEFAULT', '"off"'
            versionNameSuffix '-basic'
            resValue 'string', 'edition_app_name', 'CleanYourTV HY320 Pro Basic'
        }
        advanced {
            dimension 'edition'
            buildConfigField 'boolean', 'ADVANCED_SETTINGS', 'true'
            // Automatic unless Settings > Seasonal themes says otherwise.
            buildConfigField 'String', 'SEASONAL_DEFAULT', '"auto"'
            versionNameSuffix '-advanced'
            resValue 'string', 'edition_app_name', 'CleanYourTV HY320 Pro Advanced'
        }
    }
    signingConfigs {
        publicRelease {
            storeFile file(System.getenv('CYTV_KEYSTORE') ?: System.getProperty('user.home') + '/.android/debug.keystore')
            keyAlias System.getenv('CYTV_KEY_ALIAS') ?: 'androiddebugkey'
            storePassword System.getenv('CYTV_STORE_PASSWORD') ?: 'android'
            keyPassword System.getenv('CYTV_KEY_PASSWORD') ?: 'android'
        }
    }

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 130
        versionName '1.3.0'
        buildConfigField 'String', 'SIGNING_CERT_SHA256', '"' + providers.gradleProperty('releaseCertificateSha256').getOrElse('UNCONFIGURED') + '"'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Both editions and the companion must use the same private update identity.
            signingConfig signingConfigs.publicRelease
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}

tasks.configureEach { task ->
    if (task.name.startsWith('assemble') && task.name.endsWith('Release')) {
        task.doFirst {
            if (!(providers.gradleProperty('releaseCertificateSha256').getOrElse('') ==~ /[0-9a-f]{64}/))
                throw new GradleException('Use python scripts/build.py with your signing key; an explicit certificate pin is required.')
        }
    }
}
